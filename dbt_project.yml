name: logistica_analytics
version: "1.0.0"
config-version: 2

profile: logistica_analytics

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

vars:
  fecha_desde: "2024-01-01"
  fecha_hasta: "2025-12-31"
  # Días hacia atrás que se reprocesan en cada corrida incremental (llegadas tardías)
  dias_reproceso: 7

models:
  logistica_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  logistica_analytics:
    +schema: referencia
